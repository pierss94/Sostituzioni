<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sostituzioni</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#6a7380;--bd:#dde1e6;--ac:#1f6feb;--ok:#1a7f37;--ko:#cf222e;--wa:#b26a00;--okbg:#e6f4ea;--kobg:#fde8ea;--wabg:#fff3dc}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#181e26;--tx:#e8ecf1;--mu:#8b95a3;--bd:#2a323d;--ac:#4c9aff;--ok:#3fb950;--ko:#ff6b73;--wa:#e3a33b;--okbg:#12301c;--kobg:#3a161b;--wabg:#3a2c0e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{padding:14px 16px 6px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
main{padding:0 12px 12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 2px;font-size:13px}
nav button.on{color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
input[type=text],input[type=date],select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
textarea{min-height:90px}
button.b{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 12px;border-radius:8px;font-size:15px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.d{color:var(--ko)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 10px;border-radius:999px;font-size:14px}
.chip.ass{background:var(--kobg);border-color:var(--ko);color:var(--ko);text-decoration:line-through}
.chip.half{background:var(--wabg);border-color:var(--wa);color:var(--wa)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:var(--mu)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px}
.t-ko{background:var(--kobg);color:var(--ko)}
.t-ok{background:var(--okbg);color:var(--ok)}
.t-wa{background:var(--wabg);color:var(--wa)}
.t-mu{background:var(--bg);color:var(--mu);border:1px solid var(--bd)}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--bg);color:var(--mu);padding:7px 9px;font-size:13px}
.seg button.on{background:var(--ac);color:#fff}
.seg button.on.v1{background:var(--wa)}
.mu{color:var(--mu);font-size:13px}
.chain{border-left:3px solid var(--ac);padding-left:10px;margin:8px 0}
.chain div{padding:2px 0}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.mrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.mrow:last-child{border-bottom:0}
.mrow .nm{flex:1;min-width:0}
.warn{background:var(--wabg);color:var(--wa);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
td.n,th.n{text-align:right}
</style>
</head>
<body>
<header><h1>Sostituzioni a catena</h1></header>
<main id="view"></main>
<nav id="tabs"></nav>

<script>
//CORE-START
function hungarian(a,n){
  var INF=1e12,u=[],v=[],p=[],way=[],i,j;
  for(i=0;i<=n;i++){u[i]=0;v[i]=0;p[i]=0;way[i]=0;}
  for(i=1;i<=n;i++){
    p[0]=i;var j0=0,minv=[],used=[];
    for(j=0;j<=n;j++){minv[j]=INF;used[j]=false;}
    do{
      used[j0]=true;var i0=p[j0],delta=INF,j1=0;
      for(j=1;j<=n;j++){
        if(!used[j]){
          var cur=a[i0-1][j-1]-u[i0]-v[j];
          if(cur<minv[j]){minv[j]=cur;way[j]=j0;}
          if(minv[j]<delta){delta=minv[j];j1=j;}
        }
      }
      for(j=0;j<=n;j++){
        if(used[j]){u[p[j]]+=delta;v[j]-=delta;}else{minv[j]-=delta;}
      }
      j0=j1;
    }while(p[j0]!==0);
    do{var jj=way[j0];p[j0]=p[jj];j0=jj;}while(j0);
  }
  var ans=[];for(i=0;i<n;i++)ans[i]=-1;
  for(j=1;j<=n;j++){if(p[j]>0)ans[p[j]-1]=j-1;}
  return ans;
}
function pad2(n){return (n<10?'0':'')+n;}
function parseD(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2],12,0,0);}
function fmtD(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function pasqua(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da,12,0,0);}
var _fer={};
function feriali(y){if(_fer[y])return _fer[y];var s={};['01-01','01-06','04-25','05-01','06-02','08-15','11-01','12-08','12-25','12-26'].forEach(function(x){s[y+'-'+x]=1;});var p=pasqua(y);p.setDate(p.getDate()+1);s[fmtD(p)]=1;_fer[y]=s;return s;}
function isLav(d){var w=d.getDay();if(w===0||w===6)return false;return !feriali(d.getFullYear())[fmtD(d)];}
function bdays(from,to){var a=parseD(from),b=parseD(to);if(fmtD(a)===fmtD(b))return 0;var sign=1,lo=a,hi=b;if(b<a){sign=-1;lo=b;hi=a;}var n=0,d=new Date(lo.getTime());while(true){d.setDate(d.getDate()+1);if(d>hi)break;if(isLav(d))n++;}return sign*n;}
function statoRep(d,t){if(d>=t+3)return 'avanti';if(d>=t)return 'ok';if(d>=t-2)return 'rischio';return 'indietro';}
var W=[1,4,16,64];
function lunedi(s){var d=parseD(s),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return fmtD(d);}
function sqMattina(rot,date){var a=parseD(lunedi(rot.week)),b=parseD(lunedi(date)),wk=Math.round((b-a)/(7*864e5));return (Math.abs(wk)%2===0)?rot.mattina:(rot.mattina==='A'?'B':'A');}
function mMap(st){var o={};st.mansioni.forEach(function(m){o[m.id]=m;});return o;}
function turnoP(st,p,mm){var m=(mm||mMap(st))[p.home];return (m&&m.active&&(m.turno==='A'||m.turno==='B'))?m.turno:'G';}
function mkCtx(st){
  var mm=mMap(st),gm={},seatsOf={},w={},gc={};
  (st.gruppi||[]).forEach(function(g){gm[g.id]=g;});
  st.mansioni.forEach(function(m){if(m.active&&m.gruppo&&gm[m.gruppo])(seatsOf[m.gruppo]=seatsOf[m.gruppo]||[]).push(m);});
  st.mansioni.forEach(function(m){
    var g=m.gruppo&&gm[m.gruppo];
    if(g&&seatsOf[g.id]){var i=seatsOf[g.id].indexOf(m),gp=(g.peso==null?3:g.peso);w[m.id]=W[(i>=0&&i<g.min)?gp:Math.max(0,gp-1)];}
    else w[m.id]=W[Math.max(0,Math.min(3,(m.peso==null?1:m.peso)))];
  });
  st.persone.forEach(function(p){
    var o={},h=mm[p.home];
    if(h&&h.gruppo&&gm[h.gruppo])o[h.gruppo]=2;
    Object.keys(p.cov||{}).forEach(function(k){var m=mm[k];if(m&&m.gruppo&&gm[m.gruppo])o[m.gruppo]=Math.max(o[m.gruppo]||0,p.cov[k]);});
    gc[p.id]=o;
  });
  return {mm:mm,gm:gm,w:w,gc:gc,seatsOf:seatsOf};
}
function lvl(ctx,p,m){
  if(m.gruppo&&ctx.gm[m.gruppo])return ctx.gc[p.id][m.gruppo]||0;
  if(p.home===m.id)return 2;
  var h=ctx.mm[p.home];
  if(h&&h.gruppo&&ctx.gm[h.gruppo])return 0;
  return (p.cov&&p.cov[m.id])||0;
}
function score(ctx,p,m){var l=lvl(ctx,p,m);if(!l)return 0;return 1000*ctx.w[m.id]+(l===2?10:4)+(p.home===m.id?1:0);}
function calcolaFascia(att,pres,prev,ctx){
  var res={assign:{},pers:{},scoperte:[],liberi:[]};
  var N=Math.max(att.length,pres.length);
  if(!N)return res;
  var cost=[],i,j;
  for(i=0;i<N;i++){cost[i]=[];for(j=0;j<N;j++){
    var c=0;
    if(i<pres.length&&j<att.length){var s=score(ctx,pres[i],att[j]);if(s>0){c=-s;if(prev&&prev[att[j].id]===pres[i].id)c-=0.5;}}
    cost[i][j]=c;
  }}
  var ans=hungarian(cost,N);
  pres.forEach(function(p,i){
    var j=ans[i];
    if(j>=0&&j<att.length&&score(ctx,p,att[j])>0){res.assign[att[j].id]=p;res.pers[p.id]=att[j];}
  });
  att.forEach(function(m){if(!res.assign[m.id])res.scoperte.push(m);});
  pres.forEach(function(p){if(!res.pers[p.id])res.liberi.push(p);});
  return res;
}
function winsOf(st,m,sq,eff){
  var t=m.turno||'G',s=(st.stop||{})[m.id],w;
  if(s&&t!=='G')return [];
  if(s==='T')return [];
  if(t!=='G')return [(t===sq.M)?[5,13]:[13,21]];
  var hp=st.persone.filter(function(p){return p.home===m.id&&(st.ass||{})[p.id]!=='T';});
  var pau=hp.length>0&&hp.every(function(p){return eff[p.id]==='pau';});
  w=pau?[[8,12],[13,17]]:[[8,13],[14,17]];
  if(s==='M')w=w.filter(function(x){return x[0]>=13;});
  if(s==='P')w=w.filter(function(x){return x[1]<=13;});
  return w;
}
function segsOf(st,ctx,p,sq,eff){
  var a=(st.ass||{})[p.id]||'',t=turnoP(st,p,ctx.mm);
  if(t!=='G'){if(a)return [];return [(t===sq.M)?[5,13]:[13,21]];}
  var v=eff[p.id]||'std';
  var S={std:[[8,13,'M'],[14,17,'P']],ant:[[7,13,'M'],[14,16,'P']],pau:[[8,12,'M'],[13,17,'P']]}[v];
  return S.filter(function(s){return a!=='T'&&a!==s[2];}).map(function(s){return [s[0],s[1]];});
}
function runDay(st,ctx,sq,eff){
  var seats=st.mansioni.filter(function(m){return m.active;}),sw={},bs={},ps={};
  seats.forEach(function(m){sw[m.id]=winsOf(st,m,sq,eff);sw[m.id].forEach(function(x){bs[x[0]]=1;bs[x[1]]=1;});});
  st.persone.forEach(function(p){ps[p.id]=segsOf(st,ctx,p,sq,eff);ps[p.id].forEach(function(x){bs[x[0]]=1;bs[x[1]]=1;});});
  var B=Object.keys(bs).map(Number).sort(function(a,b){return a-b;}),runs=[],prev=null;
  for(var i=0;i+1<B.length;i++){
    var a=B[i],b=B[i+1];
    var att=seats.filter(function(m){return sw[m.id].some(function(x){return x[0]<=a&&x[1]>=b;});});
    var pres=st.persone.filter(function(p){return ps[p.id].some(function(x){return x[0]<=a&&x[1]>=b;});});
    if(!att.length&&!pres.length)continue;
    var r=calcolaFascia(att,pres,prev,ctx);
    r.a=a;r.b=b;r.att=att;r.pres=pres;runs.push(r);
    prev={};Object.keys(r.assign).forEach(function(k){prev[k]=r.assign[k].id;});
  }
  return runs;
}
function mergeR(a){a=a.slice().sort(function(x,y){return x[0]-y[0];});var o=[];a.forEach(function(r){var l=o[o.length-1];if(l&&l[1]===r[0])l[1]=r[1];else o.push([r[0],r[1]]);});return o;}
function analizza(st,ctx,runs){
  var gaps={},gr={},grHours={},ore=0,oreCrit=0,oreBassa=0,mov={};
  runs.forEach(function(r){
    var h=r.b-r.a;
    r.scoperte.forEach(function(m){
      if(m.gruppo&&ctx.gm[m.gruppo])return;
      (gaps[m.id]=gaps[m.id]||[]).push([r.a,r.b]);
      if(ctx.w[m.id]<=W[0])oreBassa+=h;else{ore+=h;if(ctx.w[m.id]>=W[3])oreCrit+=h;}
    });
    Object.keys(ctx.gm).forEach(function(gid){
      var g=ctx.gm[gid],seats=r.att.filter(function(m){return m.gruppo===gid;});
      if(!seats.length)return;
      var n=seats.filter(function(m){return r.assign[m.id];}).length,L=(gr[gid]=gr[gid]||[]),l=L[L.length-1];
      if(l&&l.b===r.a&&l.n===n&&l.tot===seats.length)l.b=r.b;else L.push({a:r.a,b:r.b,n:n,tot:seats.length});
      var below=Math.max(0,Math.min(g.min,seats.length)-n);
      if(below){ore+=below*h;oreCrit+=below*h;grHours[gid]=(grHours[gid]||0)+below*h;}
    });
    r.pres.forEach(function(p){
      var s=r.pers[p.id]||null,L=(mov[p.id]=mov[p.id]||[]),l=L[L.length-1];
      if(l&&l.b===r.a&&((l.m&&s&&l.m.id===s.id)||(!l.m&&!s)))l.b=r.b;else L.push({a:r.a,b:r.b,m:s});
    });
  });
  Object.keys(gaps).forEach(function(k){gaps[k]=mergeR(gaps[k]);});
  return {gaps:gaps,gr:gr,grHours:grHours,ore:ore,oreCrit:oreCrit,oreBassa:oreBassa,mov:mov};
}
function calcolaGiorno(st){
  var ctx=mkCtx(st),sm=sqMattina(st.rot,st.data),sq={M:sm,P:(sm==='A'?'B':'A')};
  var ov=st.orario||{},eff={},used={},auto=[];
  st.persone.forEach(function(p){if(ov[p.id]&&ov[p.id]!=='auto'){eff[p.id]=ov[p.id];used[p.id]=1;}});
  var runs=runDay(st,ctx,sq,eff);
  st.mansioni.forEach(function(m){
    var tipo=m.cop;
    if(!m.active||!tipo||(m.turno||'G')==='G'||(st.stop||{})[m.id])return;
    var gap=runs.some(function(r){return r.scoperte.indexOf(m)>=0&&(tipo==='ant'?r.b<=8:(r.a>=13&&r.b<=14));});
    if(!gap)return;
    var cand=null;
    runs.forEach(function(r){
      if(cand)return;
      var ok=(tipo==='ant')?(r.a>=8&&r.b<=13):(r.a>=14&&r.b<=17),p=r.assign[m.id];
      if(ok&&p&&turnoP(st,p,ctx.mm)==='G'&&!used[p.id]&&!(st.ass||{})[p.id])cand=p;
    });
    if(!cand){
      st.persone.forEach(function(p){
        if(used[p.id]||(st.ass||{})[p.id]||turnoP(st,p,ctx.mm)!=='G')return;
        var l=lvl(ctx,p,m);
        if(l&&(!cand||l>lvl(ctx,cand,m)))cand=p;
      });
    }
    if(cand){used[cand.id]=1;eff[cand.id]=tipo;auto.push({p:cand,v:tipo,m:m});}
  });
  if(auto.length)runs=runDay(st,ctx,sq,eff);
  var ass=st.ass||{},assW=0,assList=[],fermate=[];
  st.persone.forEach(function(p){var a=ass[p.id];if(!a)return;if(turnoP(st,p,ctx.mm)!=='G')a='T';assW+=(a==='T'?1:0.5);assList.push({p:p,a:a});});
  st.mansioni.forEach(function(m){var s=(st.stop||{})[m.id];if(m.active&&s)fermate.push({m:m,f:((m.turno||'G')==='G'?s:'T')});});
  return {sq:sq,ctx:ctx,runs:runs,an:analizza(st,ctx,runs),auto:auto,eff:eff,tot:st.persone.length,assW:assW,assList:assList,fermate:fermate};
}
//CORE-END

var KEY='sostituzioni_v1';
var NOMI=['Profilatrice 1','Profilatrice 2','Assemblatrice 1','Assemblatrice 2','Imballatrice 1','Imballatrice 2','Banco 1','Banco 2','Ganci/tappi','PVC 1','PVC 2','Manutentore/jolly','Taglio 1','Taglio 2','Taglio 3','Guide+terminali 1','Guide+terminali 2','Prelievo','Pallet 1','Pallet 2','Sfusi','Legno','Muletto','Accessori','Rulli','Sporgere','Assemblaggio motori','Responsabile mag+prod'];
function oggi(){var d=new Date(),z=function(n){return(n<10?'0':'')+n;};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function defState(){
  var m=[];
  for(var i=0;i<35;i++)m.push({id:'m'+(i+1),name:NOMI[i]||('Mansione '+(i+1)),active:i<NOMI.length,peso:1,turno:defTurno(NOMI[i]||''),gruppo:'',cop:''});
  var st={mansioni:m,persone:[],ass:{},stop:{},orario:{},rot:{week:lunedi(oggi()),mattina:'A'},data:oggi(),storico:[],reparti:defReparti(m),consegne:{}};
  migraGruppi(st);
  return st;
}
function migraGruppi(st){
  if(!st.gruppi){
    st.gruppi=[{id:'gA',name:'Alluminio sq. A',min:2,peso:3},{id:'gB',name:'Alluminio sq. B',min:2,peso:3}];
    st.mansioni.forEach(function(m){var x=/^(profilatrice|assemblatrice|imballatrice)\s*([12])$/i.exec(m.name.trim());if(x)m.gruppo=(x[2]==='1'?'gA':'gB');});
  }
  st.mansioni.forEach(function(m){
    if(m.gruppo===undefined)m.gruppo='';
    if(m.cop===undefined){var x=/^pvc\s*([12])$/i.exec(m.name.trim());m.cop=x?(x[1]==='1'?'ant':'pau'):'';}
    if(m.peso==null)m.peso=1;
  });
}
function defReparti(ms){
  var n=['Taglio 1','Taglio 2','Taglio 3','Rulli','Accessori','Guide+terminali 1','Guide+terminali 2','Sporgere'],o=[];
  n.forEach(function(x){var m=ms.filter(function(y){return y.name===x;})[0];if(m)o.push({mid:m.id,target:5});});
  return o;
}
function defTurno(n){var x=/^(profilatrice|assemblatrice|imballatrice|pvc)\s*([12])$/i.exec(String(n).trim());return x?(x[2]==='1'?'A':'B'):'G';}
function ensure(){
  state.mansioni.forEach(function(m){if(!m.turno)m.turno=defTurno(m.name);});
  migraGruppi(state);
  if(!state.orario)state.orario={};
  if(!state.reparti)state.reparti=defReparti(state.mansioni);
  if(!state.consegne)state.consegne={};
  if(!state.storico)state.storico=[];
  if(!state.ass){state.ass={};(state.assenti||[]).forEach(function(id){state.ass[id]='T';});}
  delete state.assenti;
  if(!state.stop)state.stop={};
  var t=oggi();
  if(!state.rot)state.rot={week:lunedi(t),mattina:'A'};
  if(state.data!==t){state.data=t;state.ass={};state.stop={};state.orario={};}
  save();
}
var state=defState(),ui={tab:'giorno',open:{}};
function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.mansioni&&o.persone)state=o;}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function mById(id){return state.mansioni.filter(function(m){return m.id===id;})[0];}
function pById(id){return state.persone.filter(function(p){return p.id===id;})[0];}
function mn(m){return m?esc(m.name):'—';}

var TABS=[['giorno','Giorno'],['reparti','Reparti'],['mansioni','Mansioni'],['persone','Persone'],['storico','Storico'],['dati','Dati']];
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(function(t){
    return '<button data-act="tab" data-v="'+t[0]+'" class="'+(ui.tab===t[0]?'on':'')+'">'+t[1]+'</button>';
  }).join('');
}

  var rk=Object.keys(dn).sort(function(a,b){return (sc[b]||0)/dn[b]-(sc[a]||0)/dn[a];});
  if(rk.length){
    h+='<h2>Reparti sotto target</h2><div class="card"><table><tr><th>Reparto</th><th class="n">Giorni sotto</th><th class="n">%</th></tr>'+rk.map(function(n){return '<tr><td>'+esc(n)+'</td><td class="n">'+(sc[n]||0)+'/'+dn[n]+'</td><td class="n">'+Math.round((sc[n]||0)/dn[n]*100)+'%</td></tr>';}).join('')+'</table></div>';
  }
  h+='<h2>Giorni</h2>';
  function tags(l){return l.length?l.map(function(n){return '<span class="tag t-ko">'+esc(n)+'</span> ';}).join(' '):'<span class="tag t-ok">tutte coperte</span>';}
  s.forEach(function(e){
    h+='<div class="card"><div class="row"><b style="flex:1">'+esc(e.date)+'</b><span class="mu">'+nA(e)+' assenti ('+e.pct+'%)</span><button class="b d" data-act="sdel" data-id="'+e.id+'">✕</button></div>';
    h+='<div class="mu">Assenti: '+(e.assenti.map(esc).join(', ')||'nessuno')+'</div>';
    if(e.anticipi&&Object.keys(e.anticipi).length)h+='<div class="mu" style="margin:4px 0">Anticipi: '+Object.keys(e.anticipi).map(function(n){return esc(n)+' '+sg(e.anticipi[n]);}).join(' · ')+'</div>';
    if(e.v===3){
      h+='<div style="margin:4px 0">'+((e.sc||[]).length?e.sc.map(function(x){return '<span class="tag t-ko">'+esc(x.n)+' '+x.h+' h</span> ';}).join(' '):'<span class="tag t-ok">tutte coperte</span>')+'</div>';
      h+='<div class="mu">Ore scoperte '+e.ore+' ('+e.oreCrit+' critiche)'+(e.oreBassa?' · più '+e.oreBassa+' h su priorità bassa':'')+'</div>';
      if((e.cambi||[]).length)h+='<div class="mu" style="margin-top:4px">Cambi d\'orario: '+e.cambi.map(function(c){return esc(c.n)+' ('+(c.v==='ant'?'7-16':'pausa 12')+')';}).join(' · ')+'</div>';
      if((e.fermate||[]).length)h+='<div class="mu" style="margin-top:4px">Ferme per scelta: '+e.fermate.map(function(x){return esc(x.n)+' ('+FN[x.f]+')';}).join(' · ')+'</div>';
    }else if(e.v===2){
      var m=e.scM||[],p=e.scP||[];
      if(m.join('|')===p.join('|'))h+='<div>'+tags(m)+'</div>';
      else h+='<div style="margin:3px 0"><span class="mu">Mattina:</span> '+tags(m)+'</div><div style="margin:3px 0"><span class="mu">Pomeriggio:</span> '+tags(p)+'</div>';
    }else{
      h+='<div>'+tags(e.scoperte||[])+'</div>';
    }
    h+='</div>';
  });
  return h;
}

function vDati(){
  return '<div class="card"><b>Backup completo (JSON)</b><div class="row" style="margin-top:8px"><button class="b p" data-act="exj">Scarica</button><button class="b" data-act="cpj">Copia</button></div><div style="margin-top:8px"><input type="file" id="fj" accept=".json,application/json" data-chg="imj"></div></div>'+
  '<div class="card"><b>Matrice coperture (CSV)</b><div class="mu">Una riga per persona: Persona;Base;una colonna per mansione attiva con 0, 1 (parziale) o 2 (piena). Esporta, compila in Excel, reimporta.</div><div class="row" style="margin-top:8px"><button class="b p" data-act="exc">Scarica CSV</button></div><div style="margin-top:8px"><input type="file" id="fc" accept=".csv,text/csv,text/plain" data-chg="imc"></div></div>'+
  '<div class="card"><button class="b d" data-act="reset">Cancella tutti i dati</button></div>';
}

function render(){
  renderTabs();
  var f={giorno:vGiorno,reparti:vReparti,mansioni:vMansioni,persone:vPersone,storico:vStorico,dati:vDati}[ui.tab];
  document.getElementById('view').innerHTML=f();
}

function dl(name,text,type){
  var b=new Blob([text],{type:type}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function csvEsc(s){s=String(s);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function exportCSV(){
  var att=state.mansioni.filter(function(m){return m.active;});
  var out=[['Persona','Base'].concat(att.map(function(m){return m.name;})).map(csvEsc).join(';')];
  state.persone.forEach(function(p){
    var home=mById(p.home);
    out.push([p.name,home?home.name:''].concat(att.map(function(m){return m.id===p.home?'':((p.cov&&p.cov[m.id])||0);})).map(csvEsc).join(';'));
  });
  dl('matrice_coperture.csv',out.join('\n'),'text/csv');
}
function parseCSV(t){
  var first=t.split(/\r?\n/)[0]||'',sep=(first.split(';').length>=first.split(',').length)?';':',';
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===sep){row.push(cur);cur='';}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
    else if(c!=='\r')cur+=c;
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return x.trim();});});
}
function importCSV(t){
  var rows=parseCSV(t);
  if(rows.length<2){alert('CSV vuoto o non valido.');return;}
  var head=rows[0].map(function(x){return x.trim();});
  var colM=[];
  for(var c=2;c<head.length;c++){
    var m=state.mansioni.filter(function(x){return x.name.trim().toLowerCase()===head[c].toLowerCase();})[0];
    colM[c]=m||null;
  }
  var n=0;
  rows.slice(1).forEach(function(r){
    var name=(r[0]||'').trim();if(!name)return;
    var p=state.persone.filter(function(x){return x.name.toLowerCase()===name.toLowerCase();})[0];
    if(!p){p={id:uid(),name:name,home:'',cov:{}};state.persone.push(p);}
    var hm=state.mansioni.filter(function(x){return x.name.trim().toLowerCase()===(r[1]||'').trim().toLowerCase();})[0];
    p.home=hm?hm.id:'';
    p.cov={};
    for(var c=2;c<head.length;c++){
      if(!colM[c])continue;
      var v=parseInt(r[c],10);
      if((v===1||v===2)&&colM[c].id!==p.home)p.cov[colM[c].id]=v;
    }
    n++;
  });
  save();render();alert('Importate '+n+' persone.');
}
function readFile(inp,cb){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){cb(String(r.result));};r.readAsText(f);inp.value='';
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,id=b.dataset.id,p;
  if(a==='tab'){ui.tab=b.dataset.v;render();window.scrollTo(0,0);return;}
  if(a==='ass'){p=pById(id);var ca=state.ass[id]||'',nx;if(turnoP(state,p)!=='G')nx=ca?'':'T';else nx={'':'T',T:'M',M:'P',P:''}[ca];if(nx)state.ass[id]=nx;else delete state.ass[id];save();render();return;}
  if(a==='noass'){state.ass={};save();render();return;}
  if(a==='salvag'){
    var g=calcolaGiorno(state),ctx=g.ctx;
    var antc={},so=[];
    (state.reparti||[]).forEach(function(rp){var m=mById(rp.mid);if(!m||!m.active)return;var i=repInfo(rp,state.data);if(!i)return;antc[m.name]=i.days;if(i.days<rp.target)so.push(m.name);});
    var sc=[];
    Object.keys(g.an.gaps).forEach(function(k){if(ctx.w[k]<=W[0])return;sc.push({n:ctx.mm[k].name,h:hrs(g.an.gaps[k])});});
    Object.keys(g.an.grHours).forEach(function(k){sc.push({n:ctx.gm[k].name,h:g.an.grHours[k]});});
    var en={id:'s'+Date.now().toString(36),v:3,date:state.data,
      assenti:g.assList.map(function(x){return x.p.name+(x.a==='M'?' (mattina)':(x.a==='P'?' (pomeriggio)':''));}),
      nAss:g.assW,tot:g.tot,pct:g.tot?Math.round(g.assW/g.tot*1000)/10:0,
      sc:sc,ore:g.an.ore,oreCrit:g.an.oreCrit,oreBassa:g.an.oreBassa,
      cambi:g.auto.map(function(x){return {n:x.p.name,v:x.v};}),
      fermate:g.fermate.map(function(x){return {n:x.m.name,f:x.f};}),
      anticipi:antc,sotto:so};
    state.storico=state.storico.filter(function(x){return x.date!==en.date;});
    state.storico.push(en);save();b.textContent='Salvato ✓';return;
  }
  if(a==='stop'){var sv=b.dataset.v;if(sv)state.stop[id]=sv;else delete state.stop[id];save();render();return;}
  if(a==='rot'){state.rot={week:lunedi(state.data),mattina:(sqMattina(state.rot,state.data)==='A'?'B':'A')};save();render();return;}
  if(a==='qadd'){
    var t=document.getElementById('qa').value.split(/\n/);
    t.forEach(function(l){
      l=l.trim();if(!l)return;
      var pr=l.split(';'),nm=pr[0].trim(),hm=pr[1]?state.mansioni.filter(function(x){return x.name.trim().toLowerCase()===pr[1].trim().toLowerCase();})[0]:null;
      state.persone.push({id:uid(),name:nm,home:hm?hm.id:'',cov:{}});
    });
    save();render();return;
  }
  if(a==='percm'){
    if(state.persone.length&&!confirm('Esistono già persone. Aggiungo comunque una persona per ogni mansione attiva senza titolare?'))return;
    state.mansioni.forEach(function(m){
      if(!m.active)return;
      if(state.persone.some(function(p){return p.home===m.id;}))return;
      state.persone.push({id:uid(),name:'Op. '+m.name,home:m.id,cov:{}});
    });
    save();render();return;
  }
  if(a==='cov'){p=pById(id);if(!p.cov)p.cov={};var v=parseInt(b.dataset.v,10);if(v)p.cov[b.dataset.m]=v;else delete p.cov[b.dataset.m];save();
    var sib=b.parentNode.querySelectorAll('button');for(var k=0;k<sib.length;k++)sib[k].classList.toggle('on',parseInt(sib[k].dataset.v,10)===v);return;}
  if(a==='copy'){
    var src=document.getElementById('cp'+id).value;if(!src)return;
    p=pById(id);var s=pById(src);p.cov={};
    Object.keys(s.cov||{}).forEach(function(k){if(k!==p.home)p.cov[k]=s.cov[k];});
    if(s.home&&s.home!==p.home)p.cov[s.home]=2;
    save();render();return;
  }
  if(a==='pdel'){if(confirm('Eliminare la persona?')){state.persone=state.persone.filter(function(x){return x.id!==id;});delete state.ass[id];save();render();}return;}
  if(a==='sdel'){state.storico=state.storico.filter(function(x){return x.id!==id;});save();render();return;}
  if(a==='crit'){state.mansioni.forEach(function(m){if(/^(banco|pvc)/i.test(m.name.trim()))m.peso=3;});save();render();return;}
  if(a==='exj'){dl('sostituzioni_backup.json',JSON.stringify(state),'application/json');return;}
  if(a==='cpj'){var tx=JSON.stringify(state);if(navigator.clipboard)navigator.clipboard.writeText(tx).then(function(){b.textContent='Copiato ✓';});return;}
  if(a==='exc'){exportCSV();return;}
  if(a==='reset'){if(confirm('Cancellare tutto?')&&confirm('Sicuro? Non si può annullare.')){state=defState();ensure();render();}return;}
});
document.addEventListener('change',function(e){
  var el=e.target,k=el.dataset&&el.dataset.chg;if(!k)return;
  var id=el.dataset.id;
  if(k==='data'){if(el.value){state.data=el.value;save();render();}return;}
  if(k==='rdate'){var cs=state.consegne;if(!cs[state.data])cs[state.data]={};if(el.value)cs[state.data][id]=el.value;else delete cs[state.data][id];save();render();return;}
  if(k==='rtarget'){var rr=repOf(id);if(rr){rr.target=Math.max(0,parseInt(el.value,10)||0);save();render();}return;}
  if(k==='rtrack'){if(el.checked){if(!repOf(id))state.reparti.push({mid:id,target:5});}else{state.reparti=state.reparti.filter(function(x){return x.mid!==id;});}save();return;}
  if(k==='mact'){mById(id).active=el.checked;save();return;}
  if(k==='mturno'){mById(id).turno=el.value;save();render();return;}
  if(k==='mpeso'){var pv=parseInt(el.value,10);mById(id).peso=isNaN(pv)?1:pv;save();return;}
  if(k==='mgruppo'){mById(id).gruppo=el.value;save();return;}
  if(k==='mcop'){mById(id).cop=el.value;save();return;}
  if(k==='gmin'){var gg=state.gruppi.filter(function(x){return x.id===id;})[0];if(gg){var gv=parseInt(el.value,10);gg.min=isNaN(gv)?0:Math.max(0,Math.min(9,gv));save();}return;}
  if(k==='ori'){if(el.value==='auto')delete state.orario[id];else state.orario[id]=el.value;save();render();return;}
  if(k==='mnome'){mById(id).name=el.value.trim()||mById(id).name;save();return;}
  if(k==='pnome'){var p=pById(id);p.name=el.value.trim()||p.name;save();return;}
  if(k==='phome'){var q=pById(id);q.home=el.value;if(q.cov&&q.home)delete q.cov[q.home];save();render();return;}
  if(k==='imj'){readFile(el,function(t){try{var o=JSON.parse(t);if(!o.mansioni||!o.persone)throw 0;state=o;ensure();render();alert('Backup ripristinato.');}catch(x){alert('File non valido.');}});return;}
  if(k==='imc'){readFile(el,importCSV);return;}
});
document.addEventListener('toggle',function(e){
  var d=e.target;if(d.tagName==='DETAILS'&&d.dataset.id)ui.open[d.dataset.id]=d.open;
},true);

load();ensure();render();
</script>
