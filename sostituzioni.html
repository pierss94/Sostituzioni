<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sostituzioni</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#6a7380;--bd:#dde1e6;--ac:#1f6feb;--ok:#1a7f37;--ko:#cf222e;--wa:#b26a00;--okbg:#e6f4ea;--kobg:#fde8ea;--wabg:#fff3dc}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#181e26;--tx:#e8ecf1;--mu:#8b95a3;--bd:#2a323d;--ac:#4c9aff;--ok:#3fb950;--ko:#ff6b73;--wa:#e3a33b;--okbg:#12301c;--kobg:#3a161b;--wabg:#3a2c0e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{padding:14px 16px 6px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
main{padding:0 12px 12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 2px;font-size:13px}
nav button.on{color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
input[type=text],input[type=date],select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
textarea{min-height:90px}
button.b{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 12px;border-radius:8px;font-size:15px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.d{color:var(--ko)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 10px;border-radius:999px;font-size:14px}
.chip.ass{background:var(--kobg);border-color:var(--ko);color:var(--ko);text-decoration:line-through}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:var(--mu)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px}
.t-ko{background:var(--kobg);color:var(--ko)}
.t-ok{background:var(--okbg);color:var(--ok)}
.t-wa{background:var(--wabg);color:var(--wa)}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--bg);color:var(--mu);padding:7px 9px;font-size:13px}
.seg button.on{background:var(--ac);color:#fff}
.seg button.on.v1{background:var(--wa)}
.mu{color:var(--mu);font-size:13px}
.chain{border-left:3px solid var(--ac);padding-left:10px;margin:8px 0}
.chain div{padding:2px 0}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.mrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.mrow:last-child{border-bottom:0}
.mrow .nm{flex:1;min-width:0}
.warn{background:var(--wabg);color:var(--wa);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
td.n,th.n{text-align:right}
</style>
</head>
<body>
<header><h1>Sostituzioni a catena</h1></header>
<main id="view"></main>
<nav id="tabs"></nav>

<script>
//CORE-START
function lvl(p,m){return p.home===m.id?2:((p.cov&&p.cov[m.id])||0);}
function score(p,m){var l=lvl(p,m);if(!l)return 0;return 1000*(m.peso||1)+(l===2?10:4)+(p.home===m.id?1:0);}
function hungarian(a,n){
  var INF=1e12,u=[],v=[],p=[],way=[],i,j;
  for(i=0;i<=n;i++){u[i]=0;v[i]=0;p[i]=0;way[i]=0;}
  for(i=1;i<=n;i++){
    p[0]=i;var j0=0,minv=[],used=[];
    for(j=0;j<=n;j++){minv[j]=INF;used[j]=false;}
    do{
      used[j0]=true;var i0=p[j0],delta=INF,j1=0;
      for(j=1;j<=n;j++){
        if(!used[j]){
          var cur=a[i0-1][j-1]-u[i0]-v[j];
          if(cur<minv[j]){minv[j]=cur;way[j]=j0;}
          if(minv[j]<delta){delta=minv[j];j1=j;}
        }
      }
      for(j=0;j<=n;j++){
        if(used[j]){u[p[j]]+=delta;v[j]-=delta;}else{minv[j]-=delta;}
      }
      j0=j1;
    }while(p[j0]!==0);
    do{var jj=way[j0];p[j0]=p[jj];j0=jj;}while(j0);
  }
  var ans=[];for(i=0;i<n;i++)ans[i]=-1;
  for(j=1;j<=n;j++){if(p[j]>0)ans[p[j]-1]=j-1;}
  return ans;
}
function calcola(st){
  var att=st.mansioni.filter(function(m){return m.active;});
  var pres=st.persone.filter(function(p){return st.assenti.indexOf(p.id)<0;});
  var assenti=st.persone.filter(function(p){return st.assenti.indexOf(p.id)>=0;});
  var res={att:att,pres:pres,assenti:assenti,tot:st.persone.length,assign:{},scoperte:[],parziali:[],spost:[],liberi:[],chains:[],altri:[]};
  var N=Math.max(att.length,pres.length);
  if(!N)return res;
  var cost=[],i,j;
  for(i=0;i<N;i++){cost[i]=[];for(j=0;j<N;j++){cost[i][j]=(i<pres.length&&j<att.length)?-score(pres[i],att[j]):0;}}
  var ans=hungarian(cost,N),byM={},asgP={};
  pres.forEach(function(p,i){
    var j=ans[i];
    if(j>=0&&j<att.length&&score(p,att[j])>0){byM[att[j].id]=p;asgP[p.id]=att[j];}
  });
  att.forEach(function(m){
    var p=byM[m.id];
    if(!p)res.scoperte.push(m);else if(lvl(p,m)===1)res.parziali.push({m:m,p:p});
  });
  pres.forEach(function(p){
    var m=asgP[p.id];
    if(!m)res.liberi.push(p);else if(p.home!==m.id)res.spost.push({p:p,m:m,l:lvl(p,m)});
  });
  var seen={};
  att.forEach(function(m0){
    if(pres.some(function(p){return p.home===m0.id;}))return;
    var steps=[],cur=m0,g={};
    while(cur&&!g[cur.id]){
      g[cur.id]=1;
      var q=byM[cur.id];
      if(!q){steps.push({m:cur});break;}
      steps.push({m:cur,p:q,l:lvl(q,cur)});seen[q.id]=1;
      cur=att.filter(function(x){return x.id===q.home;})[0];
    }
    res.chains.push({start:m0,steps:steps});
  });
  res.altri=res.spost.filter(function(s){return !seen[s.p.id];});
  res.assign=byM;
  return res;
}
//CORE-END

var KEY='sostituzioni_v1';
var NOMI=['Profilatrice 1','Profilatrice 2','Assemblatrice 1','Assemblatrice 2','Imballatrice 1','Imballatrice 2','Banco 1','Banco 2','Ganci/tappi','PVC 1','PVC 2','Manutentore/jolly','Taglio 1','Taglio 2','Taglio 3','Guide+terminali 1','Guide+terminali 2','Prelievo','Pallet 1','Pallet 2','Sfusi','Legno','Muletto','Accessori','Rulli','Sporgere','Assemblaggio motori','Responsabile mag+prod'];
function oggi(){var d=new Date(),z=function(n){return(n<10?'0':'')+n;};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function defState(){
  var m=[];
  for(var i=0;i<35;i++)m.push({id:'m'+(i+1),name:NOMI[i]||('Mansione '+(i+1)),active:i<NOMI.length,peso:1});
  return {mansioni:m,persone:[],assenti:[],data:oggi(),storico:[]};
}
var state=defState(),ui={tab:'giorno',open:{}};
function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.mansioni&&o.persone)state=o;}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function mById(id){return state.mansioni.filter(function(m){return m.id===id;})[0];}
function pById(id){return state.persone.filter(function(p){return p.id===id;})[0];}
function mn(m){return m?esc(m.name):'—';}

var TABS=[['giorno','Giorno'],['mansioni','Mansioni'],['persone','Persone'],['storico','Storico'],['dati','Dati']];
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(function(t){
    return '<button data-act="tab" data-v="'+t[0]+'" class="'+(ui.tab===t[0]?'on':'')+'">'+t[1]+'</button>';
  }).join('');
}

function vGiorno(){
  var h='';
  if(!state.persone.length){
    return '<div class="card">Non ci sono ancora persone. Vai su <b>Persone</b> e aggiungile (anche con "Crea una persona per mansione").</div>';
  }
  h+='<div class="card"><div class="row"><input type="date" id="dd" data-chg="data" value="'+esc(state.data)+'"></div>';
  h+='<h2 style="margin-top:12px">Tocca gli assenti</h2><div class="chips">';
  state.persone.forEach(function(p){
    h+='<button class="chip'+(state.assenti.indexOf(p.id)>=0?' ass':'')+'" data-act="ass" data-id="'+p.id+'">'+esc(p.name)+'</button>';
  });
  h+='</div><div class="row" style="margin-top:10px"><button class="b" data-act="noass">Nessun assente</button><button class="b p" data-act="salvag">Salva giorno</button></div></div>';
  h+=vRis(calcola(state));
  return h;
}
function vRis(r){
  var h='';
  if(!r.att.length)return '<div class="warn">Nessuna mansione attiva. Attivale in Mansioni.</div>';
  var pct=r.tot?Math.round(r.assenti.length/r.tot*1000)/10:0;
  if(r.pres.length<r.att.length)h+='<div class="warn">Presenti ('+r.pres.length+') meno delle mansioni attive ('+r.att.length+'): almeno '+(r.att.length-r.pres.length)+' restano scoperte comunque.</div>';
  h+='<div class="kpi"><div><b>'+r.assenti.length+'/'+r.tot+'</b><span>assenti ('+pct+'%)</span></div><div><b>'+(r.att.length-r.scoperte.length)+'/'+r.att.length+'</b><span>mansioni coperte</span></div><div><b>'+r.spost.length+'</b><span>spostamenti</span></div></div>';
  h+='<h2>Mansioni scoperte</h2>';
  if(r.scoperte.length){h+='<div class="card">'+r.scoperte.map(function(m){return '<span class="tag t-ko">'+mn(m)+'</span> ';}).join(' ')+'</div>';}
  else h+='<div class="card"><span class="tag t-ok">Tutte coperte</span></div>';
  if(r.parziali.length){
    h+='<h2>Coperte solo in parte</h2><div class="card">'+r.parziali.map(function(x){return '<div><span class="tag t-wa">'+mn(x.m)+'</span> ← '+esc(x.p.name)+'</div>';}).join('')+'</div>';
  }
  if(r.chains.length){
    h+='<h2>Catene di sostituzione</h2>';
    r.chains.forEach(function(c){
      h+='<div class="card"><div class="chain">';
      c.steps.forEach(function(s,i){
        if(s.p)h+='<div>'+mn(s.m)+' ← <b>'+esc(s.p.name)+'</b>'+(s.l===1?' <span class="tag t-wa">parz.</span>':'')+'</div>';
        else h+='<div>'+mn(s.m)+' <span class="tag t-ko">scoperta</span></div>';
      });
      h+='</div></div>';
    });
  }
  if(r.altri.length){
    h+='<h2>Altri spostamenti</h2><div class="card">'+r.altri.map(function(s){return '<div>'+esc(s.p.name)+' → '+mn(s.m)+(s.l===1?' <span class="tag t-wa">parz.</span>':'')+'</div>';}).join('')+'</div>';
  }
  if(r.liberi.length){
    h+='<h2>Presenti senza mansione</h2><div class="card">'+r.liberi.map(function(p){return esc(p.name);}).join(', ')+'</div>';
  }
  return h;
}

function vMansioni(){
  var n=state.mansioni.filter(function(m){return m.active;}).length;
  var h='<div class="card"><b>'+n+' attive</b> su 35. Togli la spunta alle mansioni che non sono realmente operative: non vengono né coperte né contate.<div class="mu" style="margin-top:6px"><b>Priorità</b>: quando i buchi sono più delle persone, l\'app tappa prima le mansioni con priorità più alta, anche togliendo gente a quelle più basse. Con priorità tutte uguali non sposta nessuno se il numero di scoperte non migliora.</div></div><div class="card">';
  state.mansioni.forEach(function(m){
    var pe=m.peso||1;
    h+='<div class="mrow"><input type="checkbox" data-chg="mact" data-id="'+m.id+'" '+(m.active?'checked':'')+' style="width:22px;height:22px"><input class="nm" type="text" data-chg="mnome" data-id="'+m.id+'" value="'+esc(m.name)+'"><select data-chg="mpeso" data-id="'+m.id+'" style="width:92px;padding:8px 4px">'+[[1,'Normale'],[2,'Alta'],[3,'Critica']].map(function(o){return '<option value="'+o[0]+'"'+(pe===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div>';
  });
  return h+'</div>';
}

function vPersone(){
  var h='<div class="card"><div class="mu">Una persona per riga. Facoltativo: <code>Nome;Mansione base</code></div><textarea id="qa" placeholder="Mario Rossi;Taglio 1&#10;Luca Bianchi"></textarea><div class="row" style="margin-top:8px"><button class="b p" data-act="qadd">Aggiungi</button><button class="b" data-act="percm">Crea una persona per mansione attiva</button></div></div>';
  h+='<div class="mu" style="padding:4px 4px">'+state.persone.length+' persone</div>';
  var att=state.mansioni.filter(function(m){return m.active;});
  state.persone.forEach(function(p){
    var home=mById(p.home);
    var nc=att.filter(function(m){return m.id!==p.home&&p.cov&&p.cov[m.id];}).length;
    h+='<details class="card" data-id="'+p.id+'" '+(ui.open[p.id]?'open':'')+'><summary class="row"><b style="flex:1">'+esc(p.name)+'</b><span class="mu">'+(home?esc(home.name):'senza base')+' · '+nc+' coperture</span></summary>';
    h+='<div style="margin-top:10px"><input type="text" data-chg="pnome" data-id="'+p.id+'" value="'+esc(p.name)+'">';
    h+='<select data-chg="phome" data-id="'+p.id+'" style="margin-top:8px"><option value="">Mansione base: nessuna</option>';
    att.forEach(function(m){h+='<option value="'+m.id+'"'+(p.home===m.id?' selected':'')+'>'+esc(m.name)+'</option>';});
    h+='</select>';
    h+='<div class="mu" style="margin:10px 0 4px">Cosa può coprire (piena = come il titolare, parziale = solo in parte)</div>';
    att.forEach(function(m){
      if(m.id===p.home)return;
      var cur=(p.cov&&p.cov[m.id])||0;
      h+='<div class="mrow"><span class="nm">'+esc(m.name)+'</span><div class="seg">'+[0,1,2].map(function(v){
        return '<button data-act="cov" data-id="'+p.id+'" data-m="'+m.id+'" data-v="'+v+'" class="v'+v+(cur===v?' on':'')+'">'+['No','Parz.','Piena'][v]+'</button>';
      }).join('')+'</div></div>';
    });
    h+='<div class="row" style="margin-top:10px"><select id="cp'+p.id+'"><option value="">Copia coperture da…</option>';
    state.persone.forEach(function(q){if(q.id!==p.id)h+='<option value="'+q.id+'">'+esc(q.name)+'</option>';});
    h+='</select><button class="b" data-act="copy" data-id="'+p.id+'">Copia</button></div>';
    h+='<button class="b d" style="margin-top:10px" data-act="pdel" data-id="'+p.id+'">Elimina persona</button></div></details>';
  });
  return h;
}

function vStorico(){
  var s=state.storico.slice().sort(function(a,b){return a.date<b.date?1:-1;});
  if(!s.length)return '<div class="card">Nessun giorno salvato. Dalla scheda Giorno premi "Salva giorno".</div>';
  var cnt={},tot=s.length,sp=0,sa=0;
  s.forEach(function(e){sp+=e.pct;sa+=e.assenti.length;(e.scoperte||[]).forEach(function(n){cnt[n]=(cnt[n]||0)+1;});});
  var h='<div class="kpi"><div><b>'+tot+'</b><span>giorni salvati</span></div><div><b>'+(Math.round(sp/tot*10)/10)+'%</b><span>assenza media</span></div><div><b>'+(Math.round(sa/tot*10)/10)+'</b><span>assenti/giorno</span></div></div>';
  var rows=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];});
  h+='<h2>Mansioni scoperte più spesso</h2><div class="card">';
  if(rows.length){h+='<table><tr><th>Mansione</th><th class="n">Giorni</th><th class="n">%</th></tr>'+rows.map(function(n){return '<tr><td>'+esc(n)+'</td><td class="n">'+cnt[n]+'</td><td class="n">'+Math.round(cnt[n]/tot*100)+'%</td></tr>';}).join('')+'</table>';}
  else h+='Nessuna scopertura nei giorni salvati.';
  h+='</div><h2>Giorni</h2>';
  s.forEach(function(e){
    h+='<div class="card"><div class="row"><b style="flex:1">'+esc(e.date)+'</b><span class="mu">'+e.assenti.length+' assenti ('+e.pct+'%)</span><button class="b d" data-act="sdel" data-id="'+e.id+'">✕</button></div>';
    h+='<div class="mu">Assenti: '+(e.assenti.map(esc).join(', ')||'nessuno')+'</div>';
    h+='<div>'+((e.scoperte||[]).length?e.scoperte.map(function(n){return '<span class="tag t-ko">'+esc(n)+'</span> ';}).join(' '):'<span class="tag t-ok">tutte coperte</span>')+'</div></div>';
  });
  return h;
}

function vDati(){
  return '<div class="card"><b>Backup completo (JSON)</b><div class="row" style="margin-top:8px"><button class="b p" data-act="exj">Scarica</button><button class="b" data-act="cpj">Copia</button></div><div style="margin-top:8px"><input type="file" id="fj" accept=".json,application/json" data-chg="imj"></div></div>'+
  '<div class="card"><b>Matrice coperture (CSV)</b><div class="mu">Una riga per persona: Persona;Base;una colonna per mansione attiva con 0, 1 (parziale) o 2 (piena). Esporta, compila in Excel, reimporta.</div><div class="row" style="margin-top:8px"><button class="b p" data-act="exc">Scarica CSV</button></div><div style="margin-top:8px"><input type="file" id="fc" accept=".csv,text/csv,text/plain" data-chg="imc"></div></div>'+
  '<div class="card"><button class="b d" data-act="reset">Cancella tutti i dati</button></div>';
}

function render(){
  renderTabs();
  var f={giorno:vGiorno,mansioni:vMansioni,persone:vPersone,storico:vStorico,dati:vDati}[ui.tab];
  document.getElementById('view').innerHTML=f();
}

function dl(name,text,type){
  var b=new Blob([text],{type:type}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function csvEsc(s){s=String(s);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function exportCSV(){
  var att=state.mansioni.filter(function(m){return m.active;});
  var out=[['Persona','Base'].concat(att.map(function(m){return m.name;})).map(csvEsc).join(';')];
  state.persone.forEach(function(p){
    var home=mById(p.home);
    out.push([p.name,home?home.name:''].concat(att.map(function(m){return m.id===p.home?'':((p.cov&&p.cov[m.id])||0);})).map(csvEsc).join(';'));
  });
  dl('matrice_coperture.csv',out.join('\n'),'text/csv');
}
function parseCSV(t){
  var first=t.split(/\r?\n/)[0]||'',sep=(first.split(';').length>=first.split(',').length)?';':',';
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===sep){row.push(cur);cur='';}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
    else if(c!=='\r')cur+=c;
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return x.trim();});});
}
function importCSV(t){
  var rows=parseCSV(t);
  if(rows.length<2){alert('CSV vuoto o non valido.');return;}
  var head=rows[0].map(function(x){return x.trim();});
  var colM=[];
  for(var c=2;c<head.length;c++){
    var m=state.mansioni.filter(function(x){return x.name.trim().toLowerCase()===head[c].toLowerCase();})[0];
    colM[c]=m||null;
  }
  var n=0;
  rows.slice(1).forEach(function(r){
    var name=(r[0]||'').trim();if(!name)return;
    var p=state.persone.filter(function(x){return x.name.toLowerCase()===name.toLowerCase();})[0];
    if(!p){p={id:uid(),name:name,home:'',cov:{}};state.persone.push(p);}
    var hm=state.mansioni.filter(function(x){return x.name.trim().toLowerCase()===(r[1]||'').trim().toLowerCase();})[0];
    p.home=hm?hm.id:'';
    p.cov={};
    for(var c=2;c<head.length;c++){
      if(!colM[c])continue;
      var v=parseInt(r[c],10);
      if((v===1||v===2)&&colM[c].id!==p.home)p.cov[colM[c].id]=v;
    }
    n++;
  });
  save();render();alert('Importate '+n+' persone.');
}
function readFile(inp,cb){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){cb(String(r.result));};r.readAsText(f);inp.value='';
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,id=b.dataset.id,p;
  if(a==='tab'){ui.tab=b.dataset.v;render();window.scrollTo(0,0);return;}
  if(a==='ass'){var i=state.assenti.indexOf(id);if(i>=0)state.assenti.splice(i,1);else state.assenti.push(id);save();render();return;}
  if(a==='noass'){state.assenti=[];save();render();return;}
  if(a==='salvag'){
    var r=calcola(state);
    var en={id:'s'+Date.now().toString(36),date:state.data,assenti:r.assenti.map(function(x){return x.name;}),pct:r.tot?Math.round(r.assenti.length/r.tot*1000)/10:0,scoperte:r.scoperte.map(function(m){return m.name;}),parziali:r.parziali.map(function(x){return x.m.name;}),spost:r.spost.length,presenti:r.pres.length,tot:r.tot};
    state.storico=state.storico.filter(function(x){return x.date!==en.date;});
    state.storico.push(en);save();b.textContent='Salvato ✓';return;
  }
  if(a==='qadd'){
    var t=document.getElementById('qa').value.split(/\n/);
    t.forEach(function(l){
      l=l.trim();if(!l)return;
      var pr=l.split(';'),nm=pr[0].trim(),hm=pr[1]?state.mansioni.filter(function(x){return x.name.trim().toLowerCase()===pr[1].trim().toLowerCase();})[0]:null;
      state.persone.push({id:uid(),name:nm,home:hm?hm.id:'',cov:{}});
    });
    save();render();return;
  }
  if(a==='percm'){
    if(state.persone.length&&!confirm('Esistono già persone. Aggiungo comunque una persona per ogni mansione attiva senza titolare?'))return;
    state.mansioni.forEach(function(m){
      if(!m.active)return;
      if(state.persone.some(function(p){return p.home===m.id;}))return;
      state.persone.push({id:uid(),name:'Op. '+m.name,home:m.id,cov:{}});
    });
    save();render();return;
  }
  if(a==='cov'){p=pById(id);if(!p.cov)p.cov={};var v=parseInt(b.dataset.v,10);if(v)p.cov[b.dataset.m]=v;else delete p.cov[b.dataset.m];save();
    var sib=b.parentNode.querySelectorAll('button');for(var k=0;k<sib.length;k++)sib[k].classList.toggle('on',parseInt(sib[k].dataset.v,10)===v);return;}
  if(a==='copy'){
    var src=document.getElementById('cp'+id).value;if(!src)return;
    p=pById(id);var s=pById(src);p.cov={};
    Object.keys(s.cov||{}).forEach(function(k){if(k!==p.home)p.cov[k]=s.cov[k];});
    if(s.home&&s.home!==p.home)p.cov[s.home]=2;
    save();render();return;
  }
  if(a==='pdel'){if(confirm('Eliminare la persona?')){state.persone=state.persone.filter(function(x){return x.id!==id;});state.assenti=state.assenti.filter(function(x){return x!==id;});save();render();}return;}
  if(a==='sdel'){state.storico=state.storico.filter(function(x){return x.id!==id;});save();render();return;}
  if(a==='exj'){dl('sostituzioni_backup.json',JSON.stringify(state),'application/json');return;}
  if(a==='cpj'){var tx=JSON.stringify(state);if(navigator.clipboard)navigator.clipboard.writeText(tx).then(function(){b.textContent='Copiato ✓';});return;}
  if(a==='exc'){exportCSV();return;}
  if(a==='reset'){if(confirm('Cancellare tutto?')&&confirm('Sicuro? Non si può annullare.')){state=defState();save();render();}return;}
});
document.addEventListener('change',function(e){
  var el=e.target,k=el.dataset&&el.dataset.chg;if(!k)return;
  var id=el.dataset.id;
  if(k==='data'){state.data=el.value;save();return;}
  if(k==='mact'){mById(id).active=el.checked;save();return;}
  if(k==='mpeso'){mById(id).peso=parseInt(el.value,10)||1;save();return;}
  if(k==='mnome'){mById(id).name=el.value.trim()||mById(id).name;save();return;}
  if(k==='pnome'){var p=pById(id);p.name=el.value.trim()||p.name;save();return;}
  if(k==='phome'){var q=pById(id);q.home=el.value;if(q.cov&&q.home)delete q.cov[q.home];save();render();return;}
  if(k==='imj'){readFile(el,function(t){try{var o=JSON.parse(t);if(!o.mansioni||!o.persone)throw 0;state=o;save();render();alert('Backup ripristinato.');}catch(x){alert('File non valido.');}});return;}
  if(k==='imc'){readFile(el,importCSV);return;}
});
document.addEventListener('toggle',function(e){
  var d=e.target;if(d.tagName==='DETAILS'&&d.dataset.id)ui.open[d.dataset.id]=d.open;
},true);

load();render();
</script>
